name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install tmux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes tmux
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux || true
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all
      - run: cargo build --release
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm --prefix npm/justmux test
      - run: node --test tests/npm-packages.test.mjs
      - run: node --test tests/release-workflow.test.mjs
      - run: node --test tests/install-script.test.mjs
      - name: Verify npm install and update locally
        if: runner.os == 'macOS'
        run: node scripts/test-npm-install.mjs --pty
      - name: Verify installed command names
        shell: bash
        run: |
          install_root="$RUNNER_TEMP/justmux-install"
          cargo install --path . --locked --root "$install_root"
          "$install_root/bin/jm" --version
          "$install_root/bin/justmux" --version
