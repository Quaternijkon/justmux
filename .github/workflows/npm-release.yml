name: npm distribution

# Pushing a v* version tag triggers automated verification, native builds, and
# npm Trusted Publishing (OIDC). Manual workflow_dispatch remains available
# with publish=false by default for build-only checks or manual re-runs.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified packages to npm (requires a version tag and npm environment approval)
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: npm-distribution-${{ (github.event_name == 'push' || inputs.publish) && 'publish' || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Validate source and release version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check matching package and tag versions
        id: version
        env:
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          python3 - <<'PY'
          import json, os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          npm = json.loads(Path('npm/justmux/package.json').read_text())
          if npm['version'] != version:
              raise SystemExit('Cargo and npm package versions must match')
          if os.environ['PUBLISH'] == 'true':
              if os.environ['GITHUB_REF_TYPE'] != 'tag' or os.environ['GITHUB_REF_NAME'] != 'v' + version:
                  raise SystemExit('Publishing requires the exact v' + version + ' tag')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('version=' + version + '\n')
          PY
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test npm launcher
        run: npm --prefix npm/justmux test
      - name: Test package validation
        run: node --test tests/npm-packages.test.mjs
      - name: Test local release workflow
        run: node --test tests/release-workflow.test.mjs
      - name: Test standalone installer script
        run: node --test tests/install-script.test.mjs

  native:
    name: Build and test ${{ matrix.platform }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux test and static-build dependencies
        if: runner.os == 'Linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          pkgs=()
          command -v tmux >/dev/null || pkgs+=(tmux)
          command -v musl-gcc >/dev/null || pkgs+=(musl-tools)
          command -v readelf >/dev/null || pkgs+=(binutils)
          if (( ${#pkgs[@]} > 0 )); then
            apt_opts=(-o Acquire::ForceIPv4=true -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
            apt_dir="$(mktemp -d)"
            trap 'rm -rf "$apt_dir"' EXIT
            if [[ -f /etc/apt/sources.list.d/ubuntu.sources ]]; then
              cp /etc/apt/sources.list.d/ubuntu.sources "$apt_dir/"
              apt_opts+=(-o "Dir::Etc::sourceparts=$apt_dir" -o "Dir::Etc::sourcelist=/dev/null")
            fi
            if ! timeout 45 sudo apt-get "${apt_opts[@]}" update; then
              echo "Default Ubuntu mirror stalled; switching to mirrors.edge.kernel.org"
              sed -i 's|https\?://[^ ]*ubuntu\.com/ubuntu|https://mirrors.edge.kernel.org/ubuntu|g' "$apt_dir/ubuntu.sources" 2>/dev/null || true
              timeout 60 sudo apt-get "${apt_opts[@]}" update
            fi
            sudo apt-get "${apt_opts[@]}" install --yes --no-install-recommends "${pkgs[@]}"
          fi
      - name: Install macOS test dependency
        if: runner.os == 'macOS'
        run: |
          if ! command -v tmux >/dev/null; then
            brew install tmux
          fi
      - name: Record build environment
        run: |
          rustc --version --verbose
          node --version
          npm --version
          tmux -V
          uname -sm
      - name: Test on the native runner
        run: env -u TMUX -u TMUX_PANE cargo test --locked --all --target '${{ matrix.target }}'
      - name: Build the native binary
        run: cargo build --locked --release --bin jm --target '${{ matrix.target }}'
      - name: Check native executable
        run: |
          native_binary='target/${{ matrix.target }}/release/jm'
          "$native_binary" --version
          file "$native_binary"
          if [[ '${{ runner.os }}' == Linux ]]; then
            readelf --program-headers "$native_binary" > "$RUNNER_TEMP/elf-program-headers.txt"
            if grep -q INTERP "$RUNNER_TEMP/elf-program-headers.txt"; then
              echo 'The Linux npm executable must be static, with no dynamic interpreter.' >&2
              exit 1
            fi
          fi
      - name: Exercise real terminal and popup flows
        run: |
          mkdir -p target/release
          cp 'target/${{ matrix.target }}/release/jm' target/release/jm
          python3 scripts/pty_smoke.py --cast "$RUNNER_TEMP/justmux-${{ matrix.platform }}.cast"
      - name: Prepare the native npm package
        run: >-
          node scripts/npm-packages.mjs prepare
          --platform '${{ matrix.platform }}'
          --binary 'target/${{ matrix.target }}/release/jm'
          --out dist/npm
      - name: Verify npm install and update without publishing
        run: node scripts/test-npm-install.mjs --binary 'target/${{ matrix.target }}/release/jm' --pty
      - uses: actions/upload-artifact@v4
        with:
          name: npm-native-${{ matrix.platform }}
          path: dist/npm/
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: Assemble verified npm distribution
    needs: [verify, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-native-*
          path: dist/npm
          merge-multiple: true
      - name: Restore native executable modes after artifact download
        run: chmod 755 dist/npm/justmux-*/bin/jm
      - run: node scripts/npm-packages.mjs prepare --main --out dist/npm
      - run: node scripts/npm-packages.mjs validate --dir dist/npm
      - run: node scripts/npm-packages.mjs pack --dir dist/npm
      - name: Review publication without publishing
        run: node scripts/npm-packages.mjs publish --dir dist/npm --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: justmux-npm-${{ needs.verify.outputs.version }}
          path: dist/npm/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to npm
    if: github.event_name == 'push' || inputs.publish
    needs: [verify, assemble]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Use an npm CLI with trusted-publishing support
        run: |
          npm install --global npm@11
          npm --version
      - uses: actions/download-artifact@v4
        with:
          name: justmux-npm-${{ needs.verify.outputs.version }}
          path: dist/npm
      - name: Restore executable modes after artifact download
        run: chmod 755 dist/npm/justmux-*/bin/jm dist/npm/justmux/bin/justmux.cjs
      - run: node scripts/npm-packages.mjs validate --dir dist/npm
      - name: Publish platform packages, then the main package
        run: node scripts/npm-packages.mjs publish --dir dist/npm --provenance
